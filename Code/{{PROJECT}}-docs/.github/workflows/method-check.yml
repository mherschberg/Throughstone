# Method integrity check — runs the Throughstone "doctor" on every push
# and pull request, so structural drift fails the build instead of slipping through review:
# duplicate STEP/ADR numbers, invalid statuses, architecture docs missing Version/Status/
# Version-Log, an ADR registry that disagrees with the files on disk, architecture-session
# numbering drift, incomplete conditional-session template contracts, and repo-registry rows
# that contradict themselves or are shaped so the scripts reading registries/repos.yml by line
# prefix would misread them.
#
# This file ships LIVE in the docs-hub repo — it is active from day one in a multi-repo project
# (the hub is its own repo, so this sits at that repo's .github/workflows/). In the hub it
# validates the hub's own content (ADRs + architecture docs); the STEP-index lives in the
# sibling `prompts/` repo, so those checks skip here with a note and run in full whenever the
# whole workspace is checked out (locally, and during the periodic check-in).
#
# Mono-repo-for-now project? The workspace root is the single repo, and a workflow nested under
# Code/<project>-docs/ won't trigger there — so this file also belongs at the ROOT
# `.github/workflows/`. init.sh puts it there when it creates the project; a project created
# before it did needs that copy made by hand. The run step below auto-detects the doctor path in
# either layout. See templates/ci/README.md.

name: method-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run method doctor (project integrity)
        shell: bash
        run: |
          if [ -f scripts/check.sh ]; then
            doctor=scripts/check.sh
          else
            shopt -s nullglob
            candidates=(Code/*-docs/scripts/check.sh)
            doctor="${candidates[0]:-}"
          fi
          if [ -z "${doctor:-}" ]; then
            echo "No Throughstone check.sh found." >&2
            exit 1
          fi
          bash "$doctor"
