# Canonical repo inventory for {{PROJECT}} (multi-repo projects).
# The source of truth for which repos exist and what each is — and the index to their docs:
# each entry's `location` points to a repo whose own README.md (plus an optional
# ARCHITECTURE.md) is the detailed "about". To orient in a multi-repo project, read this map
# first, then read the README of each repo you'll touch — the same way you read the
# architecture docs before a design change. Update this whenever a repo is created. Tooling/CI
# can read it to stay in sync. See METHOD.md §7.
#
# `location:` is where the repo lives — by default a `Code/*` sibling under the workspace root,
# written workspace-root-relative (e.g. Code/{{PROJECT}}-api/). It MAY instead point OUTSIDE the
# `Code/*` shell — an absolute path or any other arbitrary path — for a repo referenced in place
# where it lives, rather than created as a sibling. setup-workspace.sh uses `location`
# verbatim (clones from `remote` into it, or references it in place when there's no remote), so
# keep `location` and `remote` distinct: a clone URL goes in `remote`, never folded into `location`.
#
# Mono-repo-for-now: the entries below are folders inside the single repo, not separate repos
# yet — this inventory describes the post-split (multi-repo) target. That applies to the rows the
# method creates. A row for a repo REGISTERED IN PLACE is not one of them: that repo already exists
# as its own repo, at its own `location`, and stays there — it is not a folder in this one and not
# waiting on a split. A mono-repo project that adopts an existing codebase holds both kinds at once.
#
# Teams: give each repo a `remote:` field (any cloneable git URL). scripts/setup-workspace.sh clones from
# it, and the STEP-number reservation in runbooks/collaboration.md relies on a shared remote
# for prompts/ + this docs hub. Solo with no remotes, it's optional.
#
# `throughstone:` (per row) records how the method relates to a repo. Every repo the method
# maintains carries `managed`; a later version adds `external` for a repo that is only referenced,
# not maintained (partial adoption). The field is inert today — nothing reads it yet — and
# forward-compatible: it is written now so that future distinction is expressible without reshaping
# the inventory. Both front doors write it the same way — a repo greenfield stands up and a repo
# adopted from an existing codebase are both `managed` — so the two produce identical rows. For
# compatibility with inventories written before this field existed, a missing value is read as
# `managed`. (This per-row token is unrelated to the top-level `throughstone:` key in
# `.throughstone/manifest.yml`, which versions the method itself — different file and scope, no
# collision.)
#
# `readme:` (per row) records what the method did to that repo's README — and therefore what a
# later check-in is answerable for when it sweeps them (runbooks/check-in.md). It is a RECORD,
# never an instruction: the repo's own README is authoritative and this line is a copy that can
# drift, so trust the repo when they disagree and fix the line. One of:
#
#   stamped        The method CREATED this repo, so the whole README is the method's own —
#                  stamped from templates/repo-readme-template.md for a code repo, or written by
#                  init.sh for this docs hub and prompts/.
#   augmented      REGISTERED IN PLACE with a README already there, and its owners accepted a
#                  short `Role in {{PROJECT}}` section. That section is the only part the method
#                  wrote; the rest of the file is theirs.
#   written        REGISTERED IN PLACE with NO README, so one was written from the template and
#                  accepted. The whole file is the method's, as with `stamped` — but nothing else
#                  in that repo is scaffolded.
#   role-stated    REGISTERED IN PLACE, and its README already says what the repo is within the
#                  system. Nothing was missing, so nothing was proposed and nothing is owed.
#   declined       Proposed and refused. Nothing was written and nothing is owed — a complete
#                  outcome, not a gap (METHOD.md §7). Do not propose it again.
#   not-proposed   REGISTERED IN PLACE and the addition has not been put to its owners yet. This
#                  is the one value that means something is still open.
#
# The last three all mean the method wrote nothing, and they are three values rather than one
# because they tell a later reader to do three different things: leave it, leave it, or ask. A
# row that cannot tell them apart is why this field exists.
#
# A missing value means NOT RECORDED — read the repo, work out which of the six it is, and write
# it down. It does not default to `stamped` (which hides a real gap behind a repo that was never
# asked) and it does not default to `not-proposed` (which re-opens a question the owners already
# answered). Inventories written before this field existed have one on every row.
#
# A STANDING decline — one answer covering the remaining repos rather than just this one
# (METHOD.md §7) — is recorded by writing `declined` on every remaining registered-in-place row
# at the moment it is given. That is what "record that those repos document themselves" means,
# and there is no separate value for it: the outcome per repo is identical either way, and these
# rows are the record. A standing decline that lives only in the conversation is gone by the next
# session, and the re-asking it was meant to stop starts again.
#
# Where a project adopted an existing codebase, its recon map's **Docs (as found)** column recorded
# the same subject at scan time — whether each repo's README said what it is within the system.
# That column is the FINDING and is frozen; this field is the OUTCOME and is living, so the two are
# expected to diverge as proposals are answered. When they disagree about the repo as it stands
# today, the repo itself wins, this row is the copy to correct, and the map is left alone.
#
# `license:` (per row) records what a repo is licensed under, so the inventory can show the
# licensing picture across every repo at once — something no single LICENSE file can, and the fact
# that starts mattering as soon as the repos here do not share one license. It is a RECORD, never
# an instruction: the repo's own license file is authoritative and this line is a copy that can
# drift, so trust the repo when they disagree and fix the line. For a repo the method CREATES it is
# the posture from `.throughstone/project-license` (the value init.sh writes below). For a repo
# REGISTERED IN PLACE — one that existed before this project did — it is whatever that repo already
# says, written down as found: an identifier and the file it came from (`GPL-2.0 (COPYING)`), or
# `none stated` when the repo says nothing, which is a fact worth recording rather than a gap to
# fill. Never set a license for such a repo; see METHOD.md §7 — a repo the method did not create
# keeps what it already has, licensing included. A missing value means "not recorded", not
# "same as everything else", and repos legitimately carrying different licenses is a normal
# inventory rather than an inconsistency to reconcile.
#
# `Unset` on a created repo's row is its own answer: a project that adopted an existing codebase
# defers the license question until the codebase has been read, so these rows say so until the
# recon-map checkpoint answers it and `scripts/set-project-license.sh` rewrites them. It never
# appears on a registered-in-place row — that row records what the repo itself says, which is
# `none stated` when the answer is nothing.

repos:
  - name: "{{PROJECT}}-docs"
    location: "Code/{{PROJECT}}-docs/"
    type: docs            # docs | service | library | app | infra | tests
    throughstone: managed
    readme: stamped
    license: "{{PROJECT_LICENSE}}"
    description: "Documentation hub: architecture, ADRs, standards, registries."

  - name: "prompts"
    location: "prompts/"
    type: docs
    throughstone: managed
    readme: stamped
    license: "{{PROJECT_LICENSE}}"
    description: "prompts/STEP-index.md roadmap plus archived STEP plans and substep prompts; the build record."

  # Service / app / library repos get added here as the architecture names them. A repo the method
  # CREATES is stamped from templates/repo-readme-template.md; a repo REGISTERED IN PLACE is listed
  # here like any other but scaffolded in none of these ways — see METHOD.md §7. Give every repo
  # `throughstone: managed`. `readme:` and `license:` are the two fields that differ by which kind
  # it is: a repo the method creates carries the whole template README and takes the project
  # posture, like the rows above; a repo registered in place records the README outcome its owners
  # agreed to, and for licensing takes whatever that repo itself already says, copied as found —
  # never the posture, and never a value you picked for it. One example of each:
  #
  # Created by the method — a Code/* sibling, carrying the whole template README and the posture:
  # - name: "{{PROJECT}}-api"
  #   location: "Code/{{PROJECT}}-api/"
  #   type: service
  #   throughstone: managed
  #   readme: stamped
  #   license: "{{PROJECT_LICENSE}}"                       # the posture, as on the rows above
  #   remote: "git@example.com:TEAM/{{PROJECT}}-api.git"   # team mode: setup-workspace.sh clones this
  #   description: "..."
  #
  # Registered in place — its real location, the outcome of the one addition it was offered, and
  # its own licensing recorded as found:
  # - name: "legacy-billing"
  #   location: "/srv/src/legacy-billing/"
  #   type: service
  #   throughstone: managed
  #   readme: declined            # or augmented / written / role-stated / not-proposed
  #   license: "GPL-2.0 (COPYING)"                         # what THAT repo says; `none stated` if nothing
  #   description: "..."
